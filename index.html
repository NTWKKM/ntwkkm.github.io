    <script>
        // Register Service Worker for PWA offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('[PWA] ServiceWorker registered:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('[PWA] ServiceWorker registration failed:', error);
                    });
            });
        }

        // Initialize screen reader announcer on page load
        document.addEventListener('DOMContentLoaded', () => {
            initScreenReaderAnnouncer();
        });

        // Strip residual markdown formatting (e.g. **bold**) from AI-generated text
        function stripMarkdown(str) {
            if (!str) return '';
            return String(str).replace(/\*\*/g, '').trim();
        }

        // Infer clinical topic category for badge display
        function inferPaperCategory(title, comment) {
            const text = ((title || '') + ' ' + (comment || '')).toLowerCase();
            if (text.includes('hypertension') || text.includes('clevidipine') || text.includes('nicardipine')) return 'Hypertension • Critical Care';
            if (text.includes('buprenorphine') || text.includes('fentanyl') || text.includes('overdose') || text.includes('substance')) return 'Toxicology • Addiction';
            if (text.includes('nstemi') || text.includes('arrhythmia') || text.includes('ecg') || text.includes('cardiac') || text.includes('troponin')) return 'Cardiology • Arrhythmia';
            if (text.includes('pediatric') || text.includes('ventilation') || text.includes('ems') || text.includes('child')) return 'Pediatrics • Prehospital EMS';
            if (text.includes('stroke') || text.includes('rtpa') || text.includes('thrombolysis') || text.includes('nihss')) return 'Neurology • Stroke Protocol';
            if (text.includes('sepsis') || text.includes('antibiotic') || text.includes('lactate')) return 'Infectious Disease • Sepsis';
            if (text.includes('trauma') || text.includes('fracture') || text.includes('hemorrhage')) return 'Trauma • Resuscitation';
            return 'Emergency Medicine • Critical Care';
        }

        function estimateReadingTime(title, comment) {
            const words = ((title || '') + ' ' + (comment || '')).trim().split(/\s+/).length;
            const mins = Math.max(3, Math.min(8, Math.round(words / 15) + 3));
            return `${mins} min`;
        }

        function formatPaperDate(dateStr) {
            if (!dateStr) return 'RECENT';
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return 'RECENT';
            const day = date.getDate();
            const month = date.toLocaleString('en-US', { month: 'short' }).toUpperCase();
            return `${day} ${month}`;
        }

        // --- 2. FETCH PAPERS FROM JSON ---
        async function fetchPapers() {
            const container = document.getElementById('paper-container');
            container.innerHTML = createSkeletonUI(3, 'card');

            try {
                const currentHour = new Date().toISOString().slice(0, 13);
                const papers = await fetchWithFallback(
                    `./papers.json?v=${currentHour}`,
                    null,
                    2
                );

                if (!papers || !Array.isArray(papers)) {
                    throw new Error('Invalid data format received');
                }

                container.innerHTML = '';

                papers.forEach((paper, index) => {
                    const card = document.createElement('div');
                    card.className = 'paper-card animate-entry';
                    card.style.animationDelay = `${index * 0.05}s`;
                    card.setAttribute('role', 'listitem');

                    const cleanTitle = escapeHTML(stripMarkdown(paper.title));
                    const cleanComment = escapeHTML(paper.comment || '');
                    const categoryTag = escapeHTML(inferPaperCategory(paper.title, paper.comment));
                    const readTime = estimateReadingTime(paper.title, paper.comment);
                    const dateBadge = escapeHTML(formatPaperDate(paper.date));

                    card.innerHTML = `
                        <div class="paper-meta-row">
                            <span class="paper-date-badge">${dateBadge}</span>
                            <span class="paper-meta-time">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                ${readTime}
                            </span>
                        </div>
                        <span class="paper-category-chip">${categoryTag}</span>
                        <h3 class="paper-title">${cleanTitle}</h3>
                        <div class="paper-comment">&ldquo;${cleanComment}&rdquo;</div>
                        <a href="${sanitizeURL(paper.link)}" class="paper-link" target="_blank" rel="noopener noreferrer" draggable="false" aria-label="Read Paper: ${cleanTitle}">
                            <span>Read Paper</span>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                        </a>
                    `;
                    container.appendChild(card);
                });

                initSliderControls();
                announceToScreenReader(`Loaded ${papers.length} research papers`);

            } catch (error) {
                console.error("Error loading papers:", error);
                container.innerHTML = createErrorUI(
                    'Failed to load latest papers. Please check your connection and try again.',
                    fetchPapers
                );
            }
        }

        // --- 3. SLIDER CONTROLS, AUTO-SCROLL, & DRAG LOGIC ---
        function initSliderControls() {
            const container = document.getElementById('paper-container');
            const prevBtn = document.getElementById('slide-prev');
            const nextBtn = document.getElementById('slide-next');
            const indicatorsContainer = document.getElementById('paper-indicators');
            const cards = container.querySelectorAll('.paper-card');

            function getMetrics() {
                const card = container.querySelector('.paper-card');
                const cardWidth = card ? (card.offsetWidth + 20) : 320;
                const visibleWidth = container.clientWidth || 320;
                const maxScroll = Math.max(1, container.scrollWidth - visibleWidth);
                const maxDots = visibleWidth < 640 ? 6 : 8;
                const totalPages = Math.min(cards.length, maxDots);
                return { cardWidth, visibleWidth, maxScroll, totalPages };
            }

            function buildIndicators() {
                if (!indicatorsContainer || cards.length <= 1) {
                    if (indicatorsContainer) indicatorsContainer.innerHTML = '';
                    return;
                }
                const { maxScroll, totalPages } = getMetrics();
                indicatorsContainer.innerHTML = '';

                for (let i = 0; i < totalPages; i++) {
                    const dot = document.createElement('button');
                    dot.className = `indicator-dot ${i === 0 ? 'active' : ''}`;
                    dot.setAttribute('aria-label', `Go to paper position ${i + 1} of ${totalPages}`);
                    dot.addEventListener('click', () => {
                        resetAutoScroll();
                        const targetLeft = totalPages > 1 ? (i / (totalPages - 1)) * maxScroll : 0;
                        container.scrollTo({ left: targetLeft, behavior: 'smooth' });
                    });
                    indicatorsContainer.appendChild(dot);
                }
            }

            buildIndicators();

            let indicatorRafId = null;
            function updateIndicators() {
                if (indicatorRafId) cancelAnimationFrame(indicatorRafId);
                indicatorRafId = requestAnimationFrame(() => {
                    if (!indicatorsContainer || cards.length <= 1) return;
                    const { maxScroll, totalPages } = getMetrics();
                    const ratio = Math.min(1, Math.max(0, container.scrollLeft / maxScroll));
                    const activeIndex = totalPages > 1 ? Math.min(totalPages - 1, Math.max(0, Math.round(ratio * (totalPages - 1)))) : 0;
                    const dots = indicatorsContainer.querySelectorAll('.indicator-dot');
                    dots.forEach((dot, idx) => {
                        dot.classList.toggle('active', idx === activeIndex);
                    });
                });
            }

            container.addEventListener('scroll', updateIndicators, { passive: true });
            window.addEventListener('resize', debounce(() => {
                buildIndicators();
                updateIndicators();
            }, 100));

            container.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    resetAutoScroll();
                    container.scrollBy({ left: -getScrollAmount(), behavior: 'smooth' });
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    resetAutoScroll();
                    container.scrollBy({ left: getScrollAmount(), behavior: 'smooth' });
                }
            });

            const getScrollAmount = () => {
                const card = container.querySelector('.paper-card');
                return card ? (card.offsetWidth + 20) * 2 : 680;
            };

            let autoScrollInterval;
            let isPapersSectionVisible = true;

            function startAutoScroll() {
                if (!isPapersSectionVisible || document.hidden) return;
                clearInterval(autoScrollInterval);

                autoScrollInterval = setInterval(() => {
                    const scrollAmount = getScrollAmount();
                    const isAtEnd = container.scrollLeft + container.clientWidth >= container.scrollWidth - 10;

                    if (isAtEnd) {
                        container.scrollTo({ left: 0, behavior: 'smooth' });
                    } else {
                        container.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                    }
                }, 5000);
            }

            function resetAutoScroll() {
                clearInterval(autoScrollInterval);
                startAutoScroll();
            }

            nextBtn.addEventListener('click', () => {
                resetAutoScroll();
                container.scrollBy({ left: getScrollAmount(), behavior: 'smooth' });
            });

            prevBtn.addEventListener('click', () => {
                resetAutoScroll();
                container.scrollBy({ left: -getScrollAmount(), behavior: 'smooth' });
            });

            const sectionEl = document.getElementById('papers-section');
            if (sectionEl && 'IntersectionObserver' in window) {
                const visibilityObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        isPapersSectionVisible = entry.isIntersecting;
                        if (entry.isIntersecting) {
                            startAutoScroll();
                        } else {
                            clearInterval(autoScrollInterval);
                        }
                    });
                }, { threshold: 0.1 });
                visibilityObserver.observe(sectionEl);
            } else {
                startAutoScroll();
            }

            // Drag with mouse logic
            let isDown = false;
            let startX;
            let scrollLeft;
            let dragged = false;
            let velocity = 0;
            let lastX;
            let lastTime;
            let rafId = null;

            function trackVelocity(e) {
                const x = e.pageX - container.offsetLeft;
                const now = performance.now();
                if (lastTime !== undefined) {
                    const dt = now - lastTime;
                    const dx = x - lastX;
                    if (dt > 0) {
                        velocity = dx / dt;
                    }
                }
                lastX = x;
                lastTime = now;
            }

            function applyInertia() {
                if (Math.abs(velocity) < 0.1) {
                    if (!isDown) {
                        container.style.scrollSnapType = 'x mandatory';
                    }
                    return;
                }
                container.scrollLeft -= velocity * 16;
                velocity *= 0.95;
                rafId = requestAnimationFrame(applyInertia);
            }

            container.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                isDown = true;
                dragged = false;
                if (rafId) cancelAnimationFrame(rafId);
                startX = e.pageX - container.offsetLeft;
                scrollLeft = container.scrollLeft;
                lastX = e.pageX - container.offsetLeft;
                lastTime = performance.now();
                velocity = 0;
                clearInterval(autoScrollInterval);
            });

            container.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                const x = e.pageX - container.offsetLeft;
                const dist = Math.abs(x - startX);
                if (dist > 5) {
                    dragged = true;
                    container.classList.add('active');
                    container.style.scrollSnapType = 'none';
                }
                if (dragged) {
                    e.preventDefault();
                    const walk = (x - startX) * 1.5;
                    container.scrollLeft = scrollLeft - walk;
                    trackVelocity(e);
                }
            });

            const handleDragEnd = () => {
                if (isDown) {
                    isDown = false;
                    container.classList.remove('active');
                    startAutoScroll();
                    if (dragged) {
                        rafId = requestAnimationFrame(applyInertia);
                    } else {
                        container.style.scrollSnapType = 'x mandatory';
                    }
                }
            };

            container.addEventListener('mouseleave', handleDragEnd);
            container.addEventListener('mouseup', handleDragEnd);

            container.addEventListener('click', (e) => {
                if (dragged) {
                    e.preventDefault();
                    e.stopPropagation();
                    dragged = false;
                }
            }, true);

            container.addEventListener('touchstart', () => {
                if (rafId) cancelAnimationFrame(rafId);
                clearInterval(autoScrollInterval);
            });
            container.addEventListener('touchend', () => startAutoScroll());
            container.addEventListener('touchcancel', () => startAutoScroll());

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    clearInterval(autoScrollInterval);
                } else {
                    startAutoScroll();
                }
            });
        }

        // Vector SVG Icons for Clinical Tools
        function getProjectSVG(title) {
            const t = (title || '').toLowerCase();
            if (t.includes('coffee')) {
                return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>`;
            }
            if (t.includes('standing order') || t.includes('protocol')) {
                return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>`;
            }
            if (t.includes('ped')) {
                return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 1 0-16 0"></path><line x1="12" y1="13" x2="12" y2="17"></line></svg>`;
            }
            if (t.includes('toxico') || t.includes('bookmark')) {
                return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.31"></path><path d="M14 9.3V2"></path><path d="M8.5 2h7"></path><path d="M14 9.3a6.5 6.5 0 1 1-4 0"></path><path d="M5.52 16h12.96"></path></svg>`;
            }
            if (t.includes('acetaminophen') || t.includes('tox')) {
                return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"></path><path d="m8.5 8.5 7 7"></path></svg>`;
            }
            if (t.includes('ventsim') || t.includes('ventilator')) {
                return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6"></path><path d="M12 8c-2.5 0-5 1.5-6 4-1.5 3.5 0 8 4 8h4c4 0 5.5-4.5 4-8-1-2.5-3.5-4-6-4z"></path><path d="M8 14c.5-1 1.5-2 3-2"></path><path d="M16 14c-.5-1-1.5-2-3-2"></path></svg>`;
            }
            if (t.includes('shock') || t.includes('hemodynamic')) {
                return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.42 4.58a5.4 5.4 0 0 0-7.65 0l-.77.78-.77-.78a5.4 5.4 0 0 0-7.65 7.65l.77.78L12 20.67l7.65-7.66.77-.78a5.4 5.4 0 0 0 0-7.65z"></path><polyline points="3.5 12 7 12 9 8 12 16 14 11 16 13 20.5 13"></polyline></svg>`;
            }
            if (t.includes('refer') || t.includes('hospital')) {
                return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle><line x1="6" y1="8" x2="10" y2="8"></line><line x1="8" y1="6" x2="8" y2="10"></line></svg>`;
            }
            if (t.includes('stroke') || t.includes('rtpa')) {
                return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline><path d="m19 19-3-3"></path></svg>`;
            }
            if (t.includes('vault') || t.includes('knowledge')) {
                return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg>`;
            }
            if (t.includes('shiny') || t.includes('stat tool')) {
                return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>`;
            }
            return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="8" y1="10" x2="16" y2="10"></line><line x1="8" y1="14" x2="12" y2="14"></line></svg>`;
        }

        // --- 4. FETCH PROJECTS FROM JSON ---
        async function fetchProjects() {
            const container = document.getElementById('projects-container');
            container.innerHTML = createSkeletonUI(3, 'card');
            try {
                const currentHour = new Date().toISOString().slice(0, 13);
                const response = await fetch(`./projects.json?v=${currentHour}`);
                if (!response.ok) throw new Error('Failed to fetch projects');
                const projects = await response.json();

                container.innerHTML = '';
                projects.forEach((project, index) => {
                    const card = document.createElement('a');
                    card.href = sanitizeURL(project.url);
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';
                    card.className = 'project-card animate-entry';
                    card.style.animationDelay = `${index * 0.04}s`;
                    card.setAttribute('aria-label', project.title);

                    const categoryBadge = escapeHTML(project.category || 'Clinical Tool');
                    const footerTag = escapeHTML(project.tag || 'Interactive Workstation');

                    card.innerHTML = `
                        <div class="project-card-header">
                            <div class="project-icon-box" aria-hidden="true">${getProjectSVG(project.title)}</div>
                            <div class="project-badge-group">
                                <span class="project-category-chip">${categoryBadge}</span>
                                <span class="project-external-arrow" aria-hidden="true">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
                                </span>
                            </div>
                        </div>
                        <div class="project-card-body">
                            <h3 class="project-title">${escapeHTML(project.title)}</h3>
                            <p class="project-desc">${escapeHTML(project.desc)}</p>
                        </div>
                        <div class="project-card-footer">
                            <span class="project-version-tag">${footerTag}</span>
                            <span class="project-launch-btn">
                                <span>Launch</span>
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                            </span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading projects:", error);
                container.innerHTML = createErrorUI(
                    'Failed to load projects. Please check your connection.',
                    fetchProjects
                );
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchPapers();
            fetchProjects();
            const yearEl = document.getElementById('footer-year');
            if (yearEl) yearEl.textContent = new Date().getFullYear();
        });
    </script>
</body>

</html>
