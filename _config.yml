# Jekyll build config for ntwkkm.github.io
# Keeps internal documents (architecture, context and design notes) and
# development tooling off the published site, both at the root and under pl/.
# This repository is public, so the files remain readable on GitHub itself.

exclude:
  # --- root of ntwkkm.github.io ---
  - ARCHITECTURE.md
  - CONTEXT.md
  - DESIGN.md
  - Braun-theme.md
  - README.md
  - soul
  - package.json
  - pnpm-lock.yaml
  # --- the same documents inside the private pl/ checkout ---
  - pl/ARCHITECTURE.md
  - pl/CONTEXT.md
  - pl/DESIGN.md
  - pl/Braun-theme.md
  - pl/README.md
  - pl/soul
  - n8n-github-notion_db
  - pl/tree.json
  - pl/external_links.json
