    <script>
        // Register Service Worker for PWA offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('[PWA] ServiceWorker registered:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('[PWA] ServiceWorker registration failed:', error);
                    });
            });
        }

        // Search Optimization Utilities
        function fuzzyMatch(query, text) {
            if (!query) return true;
            if (!text) return false;
            
            const lowerQuery = query.toLowerCase().replace(/\s+/g, '');
            const lowerText = text.toLowerCase();
            
            let queryIndex = 0;
            for (let i = 0; i < lowerText.length; i++) {
                if (lowerText[i] === lowerQuery[queryIndex]) {
                    queryIndex++;
                    if (queryIndex === lowerQuery.length) return true;
                }
            }
            return false;
        }

        function highlightText(text, query) {
            if (!query || !text) return escapeHTML(text);
            
            const terms = query.toLowerCase().trim().split(/\s+/).filter(t => t.length > 0);
            if (terms.length === 0) return escapeHTML(text);
            
            const regex = new RegExp(`(${terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})`, 'gi');
            const parts = String(text).split(regex);
            
            return parts.map((part, index) => {
                const escaped = escapeHTML(part);
                if (index % 2 === 1) {
                    return `<span class="search-highlight">${escaped}</span>`;
                }
                return escaped;
            }).join('');
        }

        // Global State
        let allPosts = [];
        let filteredPosts = [];
        let currentPage = 1;
        const itemsPerPage = 10;
        let activeTags = new Set();
        let currentPostId = null;
        let tocObserver = null;

        const CACHE_KEY = 'research_blog_data_v2';
        const CACHE_DURATION = 1000 * 60 * 5; // 5 minutes

        // Tag normalization mapping
        const TAG_NORMALIZATION = {
            'Emergency': 'Emergency Medicine',
            'Infectious Disease': 'Infectious Diseases',
            'Artificial Intelligence': 'AI',
            'Artificial intelligence': 'AI',
            'Machine Learning': 'AI',
            'Critical care': 'Critical Care',
            'Public health': 'Public Health',
            'Internal medicine': 'Internal Medicine',
            'Pain management': 'Pain Management',
            'Drug discovery': 'Drug Discovery',
        };
        const TOP_TAGS_COUNT = 12;

        document.addEventListener('DOMContentLoaded', () => {
            initScreenReaderAnnouncer();
        });

        // Reading progress indicator
        function initReadingProgress() {
            const progressBar = document.createElement('div');
            progressBar.className = 'reading-progress';
            progressBar.innerHTML = '<div class="reading-progress-bar"></div>';
            document.body.prepend(progressBar);

            const progressBarFill = progressBar.querySelector('.reading-progress-bar');
            const mainContent = document.querySelector('.main-content');
            if (!mainContent) return;

            window.updateReadingProgress = () => {
                const articleView = document.getElementById('article-view');
                if (!articleView || !articleView.classList.contains('visible')) {
                    progressBar.style.display = 'none';
                    return;
                }

                let scrollTop, scrollHeight;
                if (window.innerWidth > 1024) {
                    scrollTop = mainContent.scrollTop;
                    scrollHeight = mainContent.scrollHeight - mainContent.clientHeight;
                } else {
                    scrollTop = window.scrollY || document.documentElement.scrollTop;
                    scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
                }

                const progress = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
                progressBarFill.style.width = `${Math.min(100, Math.max(0, progress))}%`;
                progressBar.style.display = 'block';
            };

            mainContent.addEventListener('scroll', window.updateReadingProgress);
            window.addEventListener('scroll', window.updateReadingProgress);
            window.addEventListener('resize', () => {
                if (window.updateReadingProgress) window.updateReadingProgress();
                if (window.innerWidth > 1024) {
                    const overlay = document.getElementById('sidebar-overlay');
                    if (overlay) {
                        overlay.classList.remove('visible');
                        overlay.setAttribute('aria-hidden', 'true');
                    }
                }
                clearTimeout(window.tocResizeTimeout);
                window.tocResizeTimeout = setTimeout(() => {
                    generateToC();
                }, 100);
            });
        }

        // Citation export with 4 formats
        function generateCitation(post, format = 'vancouver') {
            if (!post) return '';
            const authors = post.authors || 'NTWKKM Group';
            const year = post.date ? new Date(post.date).getFullYear() : '2026';
            const title = post.title || 'Untitled';
            const url = post.link || `https://ntwkkm.github.io/blog.html?id=${post.id}`;
            const pmid = post.pmid || '';
            const accessed = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

            switch (format) {
                case 'bibtex':
                    return `@article{pmid_${pmid || post.id},
  author = {${authors}},
  title = {${title}},
  journal = {Medical Research Hub (NTWKKM)},
  year = {${year}},
  pmid = {${pmid || 'N/A'}},
  url = {${url}},
  note = {Accessed: ${accessed}}
}`;
                case 'apa':
                    return `${authors} (${year}). ${title}${pmid ? `. PMID: ${pmid}` : ''}. Retrieved ${accessed}, from ${url}`;
                case 'markdown':
                    return `[${authors} (${year}). ${title}](${url})`;
                case 'vancouver':
                default:
                    return `${authors}. ${title}. ${pmid ? `PMID: ${pmid}. ` : ''}${year} [cited ${accessed}]. Available from: ${url}`;
            }
        }

        let currentCitationFormat = 'vancouver';
        let currentCitationPost = null;

        const citationCopySvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;

        function openCitationModal(post) {
            currentCitationPost = post;
            let dialog = document.getElementById('citation-popover-dialog');
            if (dialog) dialog.remove();

            dialog = document.createElement('dialog');
            dialog.id = 'citation-popover-dialog';
            dialog.className = 'citation-popover-dialog';
            dialog.setAttribute('popover', 'auto');
            dialog.innerHTML = `
                <div class="citation-modal-box" role="dialog" aria-label="Citation options">
                    <div class="citation-modal-header">
                        <h3 class="citation-modal-title">Cite Research Paper</h3>
                        <button class="citation-modal-close" id="citation-close-btn" aria-label="Close citation modal" title="Close">✕</button>
                    </div>
                    <div class="citation-format-tabs" role="tablist">
                        <button class="citation-format-tab active" data-format="vancouver" role="tab" aria-selected="true">Vancouver</button>
                        <button class="citation-format-tab" data-format="apa" role="tab" aria-selected="false">APA 7th</button>
                        <button class="citation-format-tab" data-format="bibtex" role="tab" aria-selected="false">BibTeX</button>
                        <button class="citation-format-tab" data-format="markdown" role="tab" aria-selected="false">Markdown</button>
                    </div>
                    <textarea class="citation-text-area" id="citation-text" readonly aria-label="Citation text">${escapeHTML(generateCitation(post, currentCitationFormat))}</textarea>
                    <div class="citation-modal-footer">
                        <button class="citation-copy-btn" id="citation-copy-btn" aria-label="Copy citation to clipboard">
                            ${citationCopySvg}
                            <span>Copy Citation</span>
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(dialog);

            const closeBtn = dialog.querySelector('#citation-close-btn');
            closeBtn.onclick = () => {
                if (dialog.hidePopover) dialog.hidePopover();
                else dialog.close();
            };

            dialog.querySelectorAll('.citation-format-tab').forEach(tab => {
                tab.onclick = () => switchCitationFormat(tab.dataset.format, tab);
            });

            dialog.querySelector('#citation-copy-btn').onclick = copyCitationText;

            if (dialog.showPopover) {
                dialog.showPopover();
            } else if (dialog.showModal) {
                dialog.showModal();
            }
        }

        function switchCitationFormat(format, btn) {
            currentCitationFormat = format;
            const textArea = document.getElementById('citation-text');
            if (textArea && currentCitationPost) {
                textArea.value = generateCitation(currentCitationPost, format);
            }

            document.querySelectorAll('.citation-format-tab').forEach(tab => {
                tab.classList.toggle('active', tab === btn);
                tab.setAttribute('aria-selected', tab === btn ? 'true' : 'false');
            });
        }

        function copyCitationText() {
            const textArea = document.getElementById('citation-text');
            if (!textArea) return;
            navigator.clipboard.writeText(textArea.value).then(() => {
                const btn = document.getElementById('citation-copy-btn');
                if (btn) {
                    btn.classList.add('copied');
                    btn.innerHTML = '✓ Copied!';
                    triggerHaptic('success');
                    setTimeout(() => {
                        btn.classList.remove('copied');
                        btn.innerHTML = `${citationCopySvg}<span>Copy Citation</span>`;
                    }, 2000);
                }
                announceToScreenReader('Citation copied to clipboard');
            }).catch(err => {
                console.error('Failed to copy clipboard: ', err);
            });
        }

        // Main data loading
        document.addEventListener('DOMContentLoaded', async () => {
            initReadingProgress();

            if (window.innerWidth <= 1024) {
                document.getElementById('sidebar').classList.add('collapsed');
            }

            const loadingEl = document.getElementById('loading-indicator');
            loadingEl.style.display = 'block';

            try {
                let rawData = null;
                const cached = localStorage.getItem(CACHE_KEY);

                if (cached) {
                    try {
                        const parsedCache = JSON.parse(cached);
                        if (Date.now() - parsedCache.timestamp < CACHE_DURATION) {
                            rawData = parsedCache.data;
                        }
                    } catch (e) { console.warn("Cache error"); }
                }

                if (!rawData) {
                    const cacheBuster = `?v=${Date.now()}`;
                    const fileList = await fetchWithFallback('./blog_index.json' + cacheBuster, []);

                    if (!fileList.length) {
                        throw new Error('No blog data files found');
                    }

                    const fetchPromises = fileList.map(file =>
                        fetchWithFallback(`./${file}${cacheBuster}`, [])
                    );
                    const allFilesData = await Promise.all(fetchPromises);
                    rawData = allFilesData.flat();

                    if (!rawData.length) {
                        throw new Error('No blog posts found');
                    }

                    localStorage.setItem(CACHE_KEY, JSON.stringify({
                        timestamp: Date.now(),
                        data: rawData
                    }));
                }

                const rawList = Array.isArray(rawData) ? rawData : (rawData.data || []);

                allPosts = rawList.map(item => {
                    const tags = [item.property_tag_1, item.property_tag_2, item.property_tag_3]
                        .filter(t => t && t.trim() !== "")
                        .map(t => TAG_NORMALIZATION[t.trim()] || t.trim())
                        .filter((t, i, arr) => arr.indexOf(t) === i);
                    let dateStr = "";
                    let timestamp = 0;
                    if (item.property_last_edited_time) {
                        const d = new Date(item.property_last_edited_time);
                        timestamp = d.getTime();
                        dateStr = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
                    }

                    return {
                        id: item.id,
                        title: item.name,
                        summary: item.property_comment,
                        objective: item.property_objective || null,
                        method: item.property_method || null,
                        result: item.property_result || item.property_conclusion || null,
                        date: dateStr,
                        timestamp: timestamp,
                        tags: tags,
                        link: item.url,
                        pmid: item.property_pmid,
                        authors: item.property_authors || item.authors || null
                    };
                });

                allPosts.sort((a, b) => b.timestamp - a.timestamp);
                filteredPosts = [...allPosts];

                initTags(allPosts);
                renderSidebar();
                setupEventListeners();
                handleRouting();

            } catch (error) {
                console.error("Error:", error);
                document.getElementById('sidebar-list').innerHTML = `
                    <div style="padding:20px; text-align:center; color:var(--text-muted); display:flex; flex-direction:column; align-items:center; gap:10px;">
                        <span>Failed to load data.</span>
                        <button onclick="location.reload()" class="pagination-btn" style="cursor:pointer; width:auto; border-radius:50px; font-size:0.8rem; padding:6px 16px;">Retry ↻</button>
                    </div>`;
            } finally {
                loadingEl.style.display = 'none';
            }
        });

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar) sidebar.classList.add('collapsed');
            if (overlay) {
                overlay.classList.remove('visible');
                overlay.setAttribute('aria-hidden', 'true');
            }
        }

        function openSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar) sidebar.classList.remove('collapsed');
            if (overlay && window.innerWidth <= 1024) {
                overlay.classList.add('visible');
                overlay.setAttribute('aria-hidden', 'false');
            }
        }

        function setupEventListeners() {
            document.getElementById('search-input').addEventListener('input', debounce((e) => handleFilter(e.target.value), 300));
            document.getElementById('prev-btn').addEventListener('click', () => changePage(-1));
            document.getElementById('next-btn').addEventListener('click', () => changePage(1));

            const overlay = document.getElementById('sidebar-overlay');
            if (overlay) overlay.addEventListener('click', closeSidebar);

            // Command bar toggle
            const toggleBtn = document.getElementById('sidebar-toggle-btn');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    const sidebar = document.getElementById('sidebar');
                    if (sidebar && sidebar.classList.contains('collapsed')) {
                        openSidebar();
                    } else {
                        closeSidebar();
                    }
                });
            }

            // Article Navigation
            document.getElementById('nav-prev-article').addEventListener('click', () => navigateArticle(-1));
            document.getElementById('nav-next-article').addEventListener('click', () => navigateArticle(1));

            // Citation Button
            document.getElementById('citation-btn').addEventListener('click', () => {
                const post = allPosts.find(p => p.id === currentPostId);
                if (post) openCitationModal(post);
            });

            // Font Size Zoom Controls
            let currentFontSize = 1;
            const applyFontSize = (size) => {
                currentFontSize = Math.min(Math.max(size, 0.8), 1.5);
                const articleView = document.getElementById('article-view');
                if (articleView) {
                    articleView.style.setProperty('--reader-scale', currentFontSize);
                }
                try { localStorage.setItem('reader_font_size', currentFontSize.toFixed(2)); } catch(e) {}
            };
            try {
                const savedFontSize = parseFloat(localStorage.getItem('reader_font_size'));
                if (!isNaN(savedFontSize) && savedFontSize >= 0.8 && savedFontSize <= 1.5) {
                    applyFontSize(savedFontSize);
                }
            } catch(e) {}

            document.getElementById('font-decrease')?.addEventListener('click', () => {
                applyFontSize(currentFontSize - 0.1);
                triggerHaptic('light');
            });
            document.getElementById('font-increase')?.addEventListener('click', () => {
                applyFontSize(currentFontSize + 0.1);
                triggerHaptic('light');
            });

            // Mobile Navigation Bar
            document.getElementById('mob-nav-menu')?.addEventListener('click', () => {
                openSidebar();
                triggerHaptic('light');
            });
            document.getElementById('mob-nav-prev')?.addEventListener('click', () => {
                navigateArticle(-1);
                triggerHaptic('light');
            });
            document.getElementById('mob-nav-cite')?.addEventListener('click', () => {
                const post = allPosts.find(p => p.id === currentPostId);
                if (post) openCitationModal(post);
                triggerHaptic('light');
            });
            document.getElementById('mob-nav-next')?.addEventListener('click', () => {
                navigateArticle(1);
                triggerHaptic('light');
            });

            // Keyboard Shortcuts
            document.addEventListener('keydown', (e) => {
                const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
                const isInput = tag === 'input' || tag === 'textarea' || tag === 'select' || (document.activeElement && document.activeElement.isContentEditable);
                
                if (isInput) {
                    if (e.key === 'Escape') {
                        document.activeElement.blur();
                        if (window.innerWidth <= 1024) closeSidebar();
                    }
                    return;
                }
                const citationDialog = document.getElementById('citation-popover-dialog');
                if (citationDialog?.open) return;

                if (e.key === 'ArrowLeft') {
                    navigateArticle(-1);
                } else if (e.key === 'ArrowRight') {
                    navigateArticle(1);
                } else if (e.key === '/') {
                    if (e.ctrlKey || e.metaKey || e.altKey) return;
                    e.preventDefault();
                    openSidebar();
                    const searchInput = document.getElementById('search-input');
                    if (searchInput) {
                        searchInput.focus();
                        searchInput.select();
                    }
                } else if (e.key === 'Escape' && window.innerWidth <= 1024) {
                    closeSidebar();
                }
            });
        }

        // Initialize Topics / Tags
        function initTags(posts) {
            const tagCounts = new Map();
            posts.forEach(p => {
                if (p.tags) p.tags.forEach(t => {
                    tagCounts.set(t, (tagCounts.get(t) || 0) + 1);
                });
            });

            const sortedTags = Array.from(tagCounts.entries())
                .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));

            const countBadge = document.getElementById('topics-count-badge');
            if (countBadge) {
                countBadge.textContent = `${sortedTags.length} Available`;
            }

            const topTags = sortedTags.slice(0, TOP_TAGS_COUNT);
            const moreTags = sortedTags.slice(TOP_TAGS_COUNT);

            const container = document.getElementById('filter-tags-container');
            container.innerHTML = '';

            const allPill = createTagPill('all', 'All', posts.length);
            allPill.classList.add('active');
            container.appendChild(allPill);

            topTags.forEach(([tag, count]) => {
                container.appendChild(createTagPill(tag, tag, count));
            });

            const dropdown = document.getElementById('more-tags-dropdown');
            dropdown.innerHTML = '';

            if (moreTags.length > 0) {
                const moreBtn = document.createElement('span');
                moreBtn.className = 'filter-tag more-btn';
                moreBtn.id = 'more-tags-btn';
                moreBtn.innerHTML = `More <span class="tag-count">(${moreTags.length})</span> ▾`;
                moreBtn.onclick = (e) => {
                    e.stopPropagation();
                    moreBtn.classList.toggle('open');
                    dropdown.classList.toggle('open');
                    moreBtn.innerHTML = dropdown.classList.contains('open')
                        ? `Less ▴`
                        : `More <span class="tag-count">(${moreTags.length})</span> ▾`;
                };
                container.appendChild(moreBtn);

                moreTags.forEach(([tag, count]) => {
                    dropdown.appendChild(createTagPill(tag, tag, count));
                });
            }
        }

        function createTagPill(dataTag, label, count) {
            const span = document.createElement('span');
            span.className = 'filter-tag';
            span.dataset.tag = dataTag;
            span.innerHTML = `${escapeHTML(label)} <span class="tag-count">(${count})</span>`;
            span.onclick = () => selectTag(dataTag);
            if (activeTags.has(dataTag)) span.classList.add('active');
            return span;
        }

        function selectTag(tag) {
            if (tag === 'all') {
                activeTags.clear();
            } else {
                if (activeTags.has(tag)) {
                    activeTags.delete(tag);
                } else {
                    activeTags.add(tag);
                }
            }
            refreshTagUI();
            updateURLState();
            document.getElementById('search-input').value = '';
            handleFilter('');
        }

        function refreshTagUI() {
            document.querySelectorAll('.filter-tag').forEach(el => {
                if (el.classList.contains('more-btn')) return;
                if (el.dataset.tag === 'all') {
                    el.classList.toggle('active', activeTags.size === 0);
                } else if (el.dataset.tag) {
                    el.classList.toggle('active', activeTags.has(el.dataset.tag));
                }
            });
            const badge = document.getElementById('active-filters-badge');
            if (activeTags.size > 0) {
                badge.classList.add('visible');
                badge.innerHTML = `(${activeTags.size} active) <button class="clear-filters-btn" onclick="selectTag('all')" title="Clear all filters">✕</button>`;
            } else {
                badge.classList.remove('visible');
                badge.innerHTML = '';
            }
        }

        function handleFilter(query) {
            const lowerQuery = query.toLowerCase();
            filteredPosts = allPosts.filter(post => {
                const matchesTag = activeTags.size === 0 || (post.tags && post.tags.some(t => activeTags.has(t)));
                const matchesSearch = fuzzyMatch(lowerQuery, post.title) ||
                    fuzzyMatch(lowerQuery, post.id) ||
                    fuzzyMatch(lowerQuery, post.summary) ||
                    fuzzyMatch(lowerQuery, post.objective) ||
                    fuzzyMatch(lowerQuery, post.method) ||
                    fuzzyMatch(lowerQuery, post.result) ||
                    (post.tags && post.tags.some(t => t.toLowerCase().includes(lowerQuery)));
                return matchesTag && matchesSearch;
            });
            currentPage = 1;
            renderSidebar();
        }

        function renderSidebar() {
            const listContainer = document.getElementById('sidebar-list');
            listContainer.innerHTML = '';

            if (filteredPosts.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; padding:24px 16px; color:var(--text-muted); font-size:0.82rem;">No results found.</div>';
                updatePaginationControls();
                return;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const pageItems = filteredPosts.slice(startIndex, startIndex + itemsPerPage);

            pageItems.forEach(post => {
                const item = document.createElement('div');
                item.className = 'article-list-item';
                if (post.id === currentPostId) item.classList.add('active');
                item.dataset.id = post.id;
                
                const searchQuery = document.getElementById('search-input').value;
                const highlightedTitle = highlightText(post.title, searchQuery);
                
                item.innerHTML = `<div class="list-title">${highlightedTitle}</div><div class="list-meta"><span>${escapeHTML(post.date)}</span></div>`;
                item.onclick = () => loadArticle(post);
                listContainer.appendChild(item);
            });
            updatePaginationControls();
        }

        function updatePaginationControls() {
            const totalPages = Math.ceil(filteredPosts.length / itemsPerPage);
            document.getElementById('page-info').textContent = `${currentPage} / ${totalPages || 1}`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage >= totalPages || totalPages === 0;
        }

        function changePage(delta) {
            currentPage += delta;
            renderSidebar();
            document.querySelector('.sidebar-content').scrollTop = 0;
        }

        function loadArticle(post, pushHistory = true) {
            currentPostId = post.id;
            document.title = `${post.title} | Medical Research Blog`;

            document.getElementById('empty-state').style.display = 'none';
            const articleView = document.getElementById('article-view');
            articleView.classList.remove('visible');

            // Update Header Meta
            const dateEl = document.getElementById('post-date');
            if (dateEl) dateEl.textContent = post.date || 'Recent';

            const rawContent = `${post.title || ''} ${post.summary || ''} ${post.objective || ''} ${post.method || ''} ${post.result || ''}`;
            const wordCount = rawContent.trim().split(/\s+/).filter(Boolean).length;
            const charCount = rawContent.length;
            const estMin = Math.max(1, Math.ceil(wordCount / 180 + charCount / 1000));
            const readingTimeVal = document.getElementById('reading-time-val');
            if (readingTimeVal) readingTimeVal.textContent = `${estMin} min read`;

            document.getElementById('post-title').textContent = post.title;

            // Render Tags
            const tagsContainer = document.getElementById('post-tags');
            tagsContainer.innerHTML = '';
            if (post.tags && post.tags.length > 0) {
                post.tags.forEach(tag => {
                    const tagEl = document.createElement('span');
                    tagEl.className = 'tag-badge';
                    tagEl.textContent = tag;
                    tagEl.onclick = (e) => { e.stopPropagation(); selectTag(tag); };
                    tagsContainer.appendChild(tagEl);
                });
            }

            // Render Content
            const summaryContainer = document.getElementById('formatted-summary-container');
            summaryContainer.innerHTML = parseContent(post);

            // Generate Table of Contents
            generateToC();

            // Render Related Papers
            renderRelatedPapers(post);

            const linkBtn = document.getElementById('post-link');
            const bookSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right:6px;"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>`;
            if (post.pmid) {
                linkBtn.href = `https://pubmed.ncbi.nlm.nih.gov/${post.pmid}/`;
                linkBtn.innerHTML = `${bookSvg}View on PubMed`;
                linkBtn.style.display = 'inline-flex';
            } else if (post.link) {
                linkBtn.href = sanitizeURL(post.link);
                linkBtn.innerHTML = `${bookSvg}Read Source`;
                linkBtn.style.display = 'inline-flex';
            } else {
                linkBtn.style.display = 'none';
            }

            document.querySelectorAll('.article-list-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.querySelector(`.article-list-item[data-id="${post.id}"]`);
            if (activeEl) activeEl.classList.add('active');

            if (pushHistory) {
                const params = new URLSearchParams();
                params.set('id', post.id);
                if (activeTags.size > 0) params.set('tag', Array.from(activeTags).join(','));
                const newUrl = `${window.location.pathname}?${params.toString()}`;
                history.pushState({ id: post.id }, '', newUrl);
            }
            updateNavButtonsState();

            setTimeout(() => {
                articleView.classList.add('visible');
                if (window.updateReadingProgress) window.updateReadingProgress();
            }, 30);
            document.querySelector('.main-content').scrollTop = 0;
            window.scrollTo(0, 0);

            if (window.innerWidth <= 1024) {
                closeSidebar();
            }
        }

        // Table of Contents Scrollspy
        function generateToC() {
            const tocContainer = document.getElementById('toc-container');
            const tocList = document.getElementById('toc-list');
            tocList.innerHTML = '';

            const headers = document.querySelectorAll('.sec-header');

            if (tocObserver) {
                tocObserver.disconnect();
                tocObserver = null;
            }

            if (headers.length > 0 && window.innerWidth >= 1280) {
                const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                const scrollBehavior = prefersReducedMotion ? 'auto' : 'smooth';
                tocContainer.style.display = 'block';
                headers.forEach((header, index) => {
                    header.id = `section-${index}`;
                    const link = document.createElement('a');
                    link.className = 'toc-link';
                    link.textContent = header.textContent;
                    link.setAttribute('href', `#section-${index}`);
                    link.onclick = (e) => {
                        e.preventDefault();
                        header.scrollIntoView({ behavior: scrollBehavior, block: 'start' });
                        document.querySelectorAll('.toc-link').forEach(el => el.classList.remove('active'));
                        link.classList.add('active');
                    };
                    tocList.appendChild(link);
                });

                tocObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const targetId = entry.target.id;
                            document.querySelectorAll('.toc-link').forEach(link => {
                                if (link.getAttribute('href') === `#${targetId}`) {
                                    link.classList.add('active');
                                } else {
                                    link.classList.remove('active');
                                }
                            });
                        }
                    });
                }, {
                    root: document.querySelector('.main-content') || null,
                    rootMargin: '-60px 0px -70% 0px',
                    threshold: 0
                });

                headers.forEach(header => tocObserver.observe(header));
            } else {
                tocContainer.style.display = 'none';
            }
        }

        // Related Papers
        function renderRelatedPapers(currentPost) {
            const container = document.getElementById('related-papers');
            const grid = document.getElementById('related-grid');
            grid.innerHTML = '';

            const related = allPosts.filter(p =>
                p.id !== currentPost.id &&
                p.tags && currentPost.tags &&
                p.tags.some(t => currentPost.tags.includes(t))
            ).slice(0, 3);

            if (related.length > 0) {
                container.style.display = 'block';
                related.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'related-card';
                    card.innerHTML = `<div class="related-title">${escapeHTML(p.title)}</div><div class="related-date">${escapeHTML(p.date)}</div>`;
                    card.onclick = () => loadArticle(p);
                    grid.appendChild(card);
                });
            } else {
                container.style.display = 'none';
            }
        }

        function navigateArticle(direction) {
            if (!currentPostId || filteredPosts.length === 0) return;
            const currentIndex = filteredPosts.findIndex(p => p.id === currentPostId);
            if (currentIndex === -1) return;
            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < filteredPosts.length) {
                loadArticle(filteredPosts[newIndex]);
            }
        }

        function updateNavButtonsState() {
            const currentIndex = filteredPosts.findIndex(p => p.id === currentPostId);
            document.getElementById('nav-prev-article').disabled = (currentIndex <= 0);
            document.getElementById('nav-next-article').disabled = (currentIndex >= filteredPosts.length - 1);
        }

        function parseContent(post) {
            if (post.objective || post.method || post.result) {
                let calloutHtml = '';
                if (post.summary && post.summary.trim()) {
                    const cleanSummary = escapeHTML(post.summary).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    calloutHtml = `
                        <div class="thai-callout-box">
                            <div class="thai-callout-icon" aria-hidden="true">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"></path><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"></path></svg>
                            </div>
                            <div class="thai-callout-text">&ldquo;${cleanSummary}&rdquo;</div>
                        </div>
                    `;
                }

                let html = calloutHtml;
                if (post.objective) html += `<div class="research-section"><div class="sec-header">Objective</div><div class="sec-content">${escapeHTML(post.objective).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div></div>`;
                if (post.method) html += `<div class="research-section"><div class="sec-header">Methods &amp; Design</div><div class="sec-content">${escapeHTML(post.method).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div></div>`;
                if (post.result) html += `<div class="research-section conclusion-section"><div class="sec-header">Results &amp; Clinical Takeaways</div><div class="sec-content">${escapeHTML(post.result).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div></div>`;
                return html;
            }
            return parseSummaryToSections(post.summary);
        }

        function parseSummaryToSections(text) {
            if (!text) return '<p style="color:var(--text-muted); font-style:italic;">No summary content available.</p>';
            const lines = text.split(/\n/);
            let html = '';
            lines.forEach(line => {
                let cleanLine = line.trim().replace(/^(?:[-•](?:\s+|$)|\*\s+)/, '');
                if (!cleanLine) return;

                let sectionTitle = "";
                let sectionContent = cleanLine;

                if (cleanLine.match(/^(\*\*)?(?:วัตถุประสงค์|Objective(?=\*\*|[:：]|\s|$))/i)) sectionTitle = "Objective";
                else if (cleanLine.match(/^(\*\*)?(?:วิธีการ|Method(?:s)?(?=\*\*|[:：]|\s|$))/i)) sectionTitle = "Methods";
                else if (cleanLine.match(/^(\*\*)?(?:ผลลัพธ์|Result(?:s)?(?=\*\*|[:：]|\s|$)|Conclusion(?:s)?(?=\*\*|[:：]|\s|$)|สรุป|ผลวิเคราะห์)/i)) sectionTitle = "Results & Conclusion";

                if (sectionTitle) {
                    sectionContent = cleanLine.replace(/^(?:\*\*(?:Results\s*(?:&|&amp;)\s*Conclusion|วัตถุประสงค์|Objective|วิธีการ|Methods|Method|Results|Result|Conclusions|Conclusion|สรุป|ผลลัพธ์[^\s:*]*|ผลวิเคราะห์)(?=\*\*|[:：]|\s).*?[:：]?\*\*[:：]?|(?:Results\s*(?:&|&amp;)\s*Conclusion|วัตถุประสงค์|Objective|วิธีการ|Methods|Method|Results|Result|Conclusions|Conclusion|สรุป|ผลลัพธ์[^\s:*]*|ผลวิเคราะห์)(?:[:：]|\s+|$))\s*/i, '').trim();
                    const safeSectionContent = escapeHTML(sectionContent).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    html += `<div class="research-section"><div class="sec-header">${escapeHTML(sectionTitle)}</div><div class="sec-content">${safeSectionContent}</div></div>`;
                } else {
                    const safeLine = escapeHTML(cleanLine).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    html += `<p class="sec-content" style="margin-bottom:12px;">${safeLine}</p>`;
                }
            });
            return html;
        }

        function updateURLState() {
            const params = new URLSearchParams(window.location.search);
            if (activeTags.size > 0) {
                params.set('tag', Array.from(activeTags).join(','));
            } else {
                params.delete('tag');
            }
            const newUrl = `${window.location.pathname}${params.toString() ? '?' + params.toString() : ''}`;
            history.replaceState({ id: currentPostId }, '', newUrl);
        }

        function handleRouting() {
            const params = new URLSearchParams(window.location.search);
            const tagParam = params.get('tag');
            const idParam = params.get('id');

            activeTags = new Set(tagParam ? tagParam.split(',').map(t => t.trim()).filter(Boolean) : []);
            refreshTagUI();
            const searchInput = document.getElementById('search-input');
            handleFilter(searchInput ? searchInput.value : '');

            if (idParam) {
                const targetPost = allPosts.find(p => p.id === idParam);
                if (targetPost) {
                    loadArticle(targetPost, false);
                    return;
                }
            }

            if (filteredPosts.length > 0) {
                loadArticle(filteredPosts[0], false);
            }
        }

        window.onpopstate = () => {
            handleRouting();
        };
    </script>
</body>
