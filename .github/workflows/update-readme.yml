# .github/workflows/update-readme.yml

name: Update README Content

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "latest_updates.json" # wait for process-blog-data to finish instead of running on the raw n8n push
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write # needed to commit and push README.md

concurrency:
  group: readme-update
  cancel-in-progress: false

jobs:
  update-markdown:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1. Check out the code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Pull whatever landed since checkout, so the push below does not collide.
      - name: Pull latest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase

      # 3. Regenerate README.md
      - name: Generate New README Content
        run: node .github/scripts/generate_readme.js

      # 4. Commit and push (third-party action, pinned to the v5 commit)
      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "docs: Auto-update Repository Contents in README.md"
          file_pattern: "README.md"
