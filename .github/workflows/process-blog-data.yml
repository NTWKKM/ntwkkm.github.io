name: Process Blog Data

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
    paths:
      - 'latest_updates.json' # runs only when n8n updates this file on main
  workflow_dispatch: # allow a manual run from GitHub

permissions:
  contents: write

# Runs queue instead of overlapping, so two pushes never race.
concurrency:
  group: blog-data-processing
  cancel-in-progress: false

jobs:
  process-and-chunk:
    # The commit step pushes to main. A run started from another branch
    # (a manual dispatch) would carry that branch's commits onto main with it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Data Processing Script
        id: process
        # Reads latest_updates.json, merges it and writes the chunks.
        run: node .github/scripts/process_blog.js

      - name: Delete latest_updates.json
        # Always delete the input, even when processing failed.
        if: always()
        run: rm -f latest_updates.json

      - name: Commit and Push Changes
        id: commit
        # Always runs, to push the deletion (and any new chunk files).
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ "${{ steps.process.outcome }}" = "success" ]; then
            # Processing succeeded: stage everything (new chunks and the deleted input).
            git add -A
          else
            # Processing failed: stage only the deleted input, as cleanup.
            git add latest_updates.json
          fi
          
          # Commit and push only when something is staged.
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: auto-chunk blog data into folders and update index"

          # main also receives n8n commits (papers.json) and the README
          # auto-commit. Rebase onto whatever landed since checkout and retry,
          # so a non-fast-forward push does not lose the processed batch.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push processed blog data after 3 attempts."
          exit 1

  deploy:
    needs: process-and-chunk
    if: ${{ needs.process-and-chunk.outputs.pushed == 'true' }}
    uses: ./.github/workflows/pages-build-deployment.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write

  update-readme:
    needs: process-and-chunk
    if: ${{ needs.process-and-chunk.outputs.pushed == 'true' }}
    uses: ./.github/workflows/update-readme.yml
    permissions:
      contents: write
